<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="MAISON VELA — Una casa de belleza privada para cabello, uñas y piel.">
<meta name="theme-color" content="#000000">
<title>MAISON VELA — Cabello, Uñas y Piel</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav" id="nav">
  <a href="#top" class="nav-brand" id="nav-brand"><span id="nav-name"></span></a>
  <a href="#" class="nav-cta" id="nav-whatsapp" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.13-2.9-7C17.18 3.03 14.7 2 12.04 2Zm0 18.14h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.23 8.23 0 0 1-1.26-4.37c0-4.55 3.7-8.25 8.26-8.25 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.84c0 4.55-3.71 8.22-8.25 8.22Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.4-.12-.56.13-.17.25-.65.81-.79.97-.15.17-.29.19-.54.06-.25-.12-1.04-.38-1.99-1.22-.73-.66-1.23-1.46-1.37-1.71-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.44.12-.15.16-.25.24-.42.08-.17.04-.31-.02-.44-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.42h-.48c-.17 0-.44.06-.67.31-.23.25-.87.85-.87 2.08 0 1.22.89 2.4 1.02 2.57.12.17 1.75 2.67 4.24 3.75.59.26 1.06.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.06-.1-.23-.16-.48-.28Z"/></svg>
    <span id="nav-cta-label"></span>
  </a>
</nav>

<header class="hero" id="top">
  <div class="hero-media" id="hero-media" hidden>
    <img src="" alt="" class="hero-img" id="hero-img">
    <div class="hero-media-overlay"></div>
  </div>
  <div class="hero-field">
    <div class="blob blob-a" data-parallax="0.18"></div>
    <div class="blob blob-b" data-parallax="0.28"></div>
    <div class="blob blob-c" data-parallax="0.4"></div>
  </div>
  <div class="hero-grain"></div>

  <div class="wrap hero-inner">
    <div class="eyebrow-row" data-reveal style="--delay:0s">
      <span class="eyebrow-dot"></span>
      <span id="hero-eyebrow"></span>
    </div>
    <h1 data-reveal style="--delay:.1s" id="hero-title"></h1>
    <p class="hero-desc" data-reveal style="--delay:.2s" id="hero-sub"></p>
    <div class="hero-actions" data-reveal style="--delay:.3s">
      <a href="#" class="btn btn-primary" id="hero-whatsapp" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.13-2.9-7C17.18 3.03 14.7 2 12.04 2Zm0 18.14h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.23 8.23 0 0 1-1.26-4.37c0-4.55 3.7-8.25 8.26-8.25 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.84c0 4.55-3.71 8.22-8.25 8.22Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.4-.12-.56.13-.17.25-.65.81-.79.97-.15.17-.29.19-.54.06-.25-.12-1.04-.38-1.99-1.22-.73-.66-1.23-1.46-1.37-1.71-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.44.12-.15.16-.25.24-.42.08-.17.04-.31-.02-.44-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.42h-.48c-.17 0-.44.06-.67.31-.23.25-.87.85-.87 2.08 0 1.22.89 2.4 1.02 2.57.12.17 1.75 2.67 4.24 3.75.59.26 1.06.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.06-.1-.23-.16-.48-.28Z"/></svg>
        <span id="hero-cta"></span>
      </a>
      <a href="#servicios" class="btn btn-ghost" id="hero-secondary"></a>
    </div>
    <div class="hero-social" data-reveal style="--delay:.32s">
      <a href="#" class="hero-social-btn" id="hero-instagram" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
      </a>
    </div>
    <div class="hero-meta" data-reveal style="--delay:.35s">
      <div class="item">
        <span class="label" id="meta-specialty-label"></span>
        <span class="value" id="meta-specialty"></span>
      </div>
      <div class="item">
        <span class="label" id="meta-hours-label"></span>
        <span class="value" id="meta-hours"></span>
      </div>
      <div class="item">
        <span class="label" id="meta-contact-label"></span>
        <span class="value" id="meta-contact"></span>
      </div>
    </div>
  </div>
  <div class="scroll-cue" id="scroll-cue"><span class="line"></span><span id="hero-scroll"></span></div>
</header>

<section id="experiencia">
  <div class="wrap about">
    <div class="panel-pad">
      <div class="about-grid">
        <div class="about-card tilt-el" data-tilt data-reveal="scale">
          <div class="about-card-inner" id="about-card-inner">
            <div class="about-card-photo" id="about-photo"></div>
            <div class="about-card-tag" id="about-tag"></div>
          </div>
        </div>
        <div class="about-copy">
          <div class="kicker" data-reveal id="ritual-eyebrow"></div>
          <p class="lede" data-reveal style="--delay:.05s" id="ritual-title"></p>
          <div id="ritual-body"></div>
        </div>
      </div>
      <div class="ritual-showcase" data-reveal style="--delay:.18s">
        <div class="ritual-carousel" id="ritual-carousel" tabindex="0">
          <div class="ritual-carousel-track" id="ritual-track"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="servicios">
  <div class="wrap">
    <div class="section-head">
      <div class="kicker" data-reveal id="services-eyebrow"></div>
      <h2 data-reveal style="--delay:.05s" id="services-title"></h2>
    </div>
    <div class="services-accordion" id="services-grid"></div>
  </div>
</section>

<section id="galeria">
  <div class="wrap gallery">
    <div class="panel-pad">
      <div class="section-head">
        <div class="kicker" data-reveal id="gallery-eyebrow"></div>
        <h2 data-reveal style="--delay:.05s" id="gallery-title"></h2>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </div>
</section>

<section id="testimonios">
  <div class="wrap">
    <div class="section-head">
      <div class="kicker" data-reveal id="testimonials-eyebrow"></div>
      <h2 data-reveal style="--delay:.05s" id="testimonials-title"></h2>
    </div>
    <div class="testimonials-grid" id="testimonials-grid"></div>
  </div>
</section>

<section id="visita">
  <div class="wrap">
    <div class="contact-grid">
      <div>
        <div class="kicker" data-reveal id="visit-eyebrow"></div>
        <h2 class="contact-title" data-reveal style="--delay:.05s" id="visit-title"></h2>
        <div class="quote-block" data-reveal style="--delay:.1s" id="quote-block">
          <p id="quote-text"></p>
          <div class="who" id="quote-who"></div>
        </div>
      </div>
      <div class="contact-card" data-reveal style="--delay:.1s">
        <div class="contact-row">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21c4-3.2 7-6.6 7-10.5A7 7 0 0 0 5 10.5C5 14.4 8 17.8 12 21Z"/><circle cx="12" cy="10.5" r="2.3"/></svg></div>
          <div class="txt"><b id="contact-address"></b></div>
        </div>
        <div class="contact-row">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.4 21 3 12.6 3 2.7c0-.6.4-1 1-1H7.7c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z"/></svg></div>
          <div class="txt"><b id="contact-phone"></b><span id="contact-phone-note"></span></div>
        </div>
        <div class="contact-row">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></div>
          <div class="txt">
            <b id="contact-hours-title"></b>
            <div class="hours-stack" id="contact-hours"></div>
          </div>
        </div>
        <a href="#" class="contact-cta-big" id="contact-whatsapp" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.13-2.9-7C17.18 3.03 14.7 2 12.04 2Zm0 18.14h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.23 8.23 0 0 1-1.26-4.37c0-4.55 3.7-8.25 8.26-8.25 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.84c0 4.55-3.71 8.22-8.25 8.22Z"/></svg>
          <span id="contact-cta"></span>
        </a>
        <div class="social-row">
          <a href="#" class="social-pill" id="social-instagram" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
            <span id="social-instagram-label"></span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="wrap">
  <div class="footer-row">
    <span class="fbrand" id="footer-brand"></span>
    <span id="footer-meta"></span>
    <a id="footer-insta" target="_blank" rel="noopener"></a>
  </div>
</footer>

<div class="lightbox" id="gallery-lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <button type="button" class="lightbox-close" id="lightbox-close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
  </button>
  <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="lightbox-panel">
    <img src="" alt="" class="lightbox-img" id="lightbox-img" decoding="async">
  </div>
  <div class="lightbox-counter" id="lightbox-counter" aria-live="polite"></div>
</div>

<script src="config.js"></script>
<script>
(function () {
  const c = CONFIG;
  const u = c.ui;
  const waLink = `https://wa.me/${c.whatsappNumber}?text=${encodeURIComponent(c.whatsappDefaultMessage)}`;

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[ch]));
  }

  document.documentElement.lang = c.lang || "es";
  document.title = `${c.brandName} — ${c.tagline}`;
  const description = document.querySelector('meta[name="description"]');
  if (description) description.content = u.metaDescription;
  const theme = document.querySelector('meta[name="theme-color"]');
  if (theme && c.colors.cream) theme.content = c.colors.cream;

  const colorMap = {
    cream: "--cream",
    cream2: "--cream-2",
    ink: "--ink",
    inkSoft: "--ink-soft",
    inkFaint: "--ink-faint",
    accent: "--accent",
    accentInv: "--accent-inv",
    accentHover: "--accent-hover",
    gray: "--gray",
    grayLight: "--gray-light",
    line: "--line",
    lineStrong: "--line-strong"
  };
  const rootStyle = document.documentElement.style;
  Object.entries(colorMap).forEach(([key, cssVar]) => {
    if (c.colors[key]) rootStyle.setProperty(cssVar, c.colors[key]);
  });

  const brandParts = c.brandName.trim().split(/\s+/);
  const navName = document.getElementById("nav-name");
  if (brandParts.length > 1) {
    const last = brandParts.pop();
    navName.innerHTML = `${esc(brandParts.join(" "))} <em>${esc(last)}</em>`;
  } else {
    navName.textContent = c.brandName;
  }

  document.getElementById("nav-cta-label").textContent = u.navBook;
  document.getElementById("hero-eyebrow").textContent = c.heroEyebrow;
  document.getElementById("hero-sub").textContent = c.heroSub;
  document.getElementById("hero-cta").textContent = u.heroCta;
  document.getElementById("hero-secondary").textContent = u.heroSecondary;
  document.getElementById("hero-scroll").textContent = u.heroScroll;
  document.getElementById("meta-specialty-label").textContent = u.metaSpecialty;
  document.getElementById("meta-specialty").textContent = c.tagline;
  document.getElementById("meta-hours-label").textContent = u.metaHours;
  document.getElementById("meta-contact-label").textContent = u.metaContact;
  document.getElementById("meta-contact").textContent = c.phoneDisplay;
  if (c.hours[0]) {
    document.getElementById("meta-hours").textContent = `${c.hours[0].day} · ${c.hours[0].time}`;
  }

  const [line1, line2] = c.heroHeadlineLines;
  const title = document.getElementById("hero-title");
  title.append(document.createTextNode(line1));
  title.append(document.createElement("br"));
  const accent = document.createElement("span");
  accent.className = "accent-word";
  accent.textContent = line2;
  title.append(accent);

  ["nav-whatsapp", "hero-whatsapp", "contact-whatsapp"].forEach((id) => {
    const el = document.getElementById(id);
    el.href = waLink;
  });
  document.getElementById("nav-whatsapp").setAttribute("aria-label", u.whatsappLabel);

  const heroInsta = document.getElementById("hero-instagram");
  const socialInsta = document.getElementById("social-instagram");
  const footerInsta = document.getElementById("footer-insta");
  [heroInsta, socialInsta, footerInsta].forEach((el) => {
    el.href = c.instagramUrl;
    el.setAttribute("aria-label", c.instagramHandle);
  });
  heroInsta.setAttribute("aria-label", c.instagramHandle);
  document.getElementById("social-instagram-label").textContent = c.instagramHandle;
  footerInsta.textContent = c.instagramHandle;

  const heroEl = document.querySelector(".hero");
  const heroMedia = document.getElementById("hero-media");
  const heroImg = document.getElementById("hero-img");
  if (c.heroImage) {
    heroImg.alt = `${c.brandName} — ${c.tagline}`;
    const heroProbe = new Image();
    heroProbe.onload = () => {
      heroImg.src = c.heroImage;
      heroMedia.hidden = false;
      heroEl.classList.add("has-hero-image");
    };
    heroProbe.src = c.heroImage;
  }

  document.getElementById("about-tag").textContent = c.brandName;
  document.getElementById("ritual-eyebrow").textContent = u.ritualEyebrow;
  document.getElementById("ritual-title").textContent = u.ritualTitle;
  const ritualBody = document.getElementById("ritual-body");
  ritualBody.innerHTML = (c.ritualSteps || []).map((step, index) => `
    <p class="body-p" data-reveal style="--delay:${0.1 + index * 0.05}s">${esc(step.text)}</p>
  `).join("");

  const aboutInner = document.getElementById("about-card-inner");
  const aboutPhoto = document.getElementById("about-photo");
  if (c.visitImage && aboutInner && aboutPhoto) {
    const portrait = new Image();
    portrait.onload = () => {
      aboutPhoto.style.backgroundImage = `url('${c.visitImage.replace(/'/g, "%27")}')`;
      aboutInner.classList.add("has-photo");
    };
    portrait.src = c.visitImage;
  }

  const quoteBlock = document.getElementById("quote-block");
  if (c.heroSub) {
    document.getElementById("quote-text").textContent = `“${c.heroSub}”`;
    document.getElementById("quote-who").textContent = c.brandName;
  } else {
    quoteBlock.hidden = true;
  }

  document.getElementById("services-eyebrow").textContent = u.servicesEyebrow;
  document.getElementById("services-title").textContent = u.servicesTitle;
  document.getElementById("gallery-eyebrow").textContent = u.galleryEyebrow;
  document.getElementById("gallery-title").textContent = u.galleryTitle;
  document.getElementById("testimonials-eyebrow").textContent = u.testimonialsEyebrow;
  document.getElementById("testimonials-title").textContent = u.testimonialsTitle;
  document.getElementById("visit-eyebrow").textContent = u.visitEyebrow;
  document.getElementById("visit-title").textContent = u.visitTitle;
  document.getElementById("contact-address").textContent = c.address;
  document.getElementById("contact-phone").textContent = c.phoneDisplay;
  document.getElementById("contact-phone-note").textContent = u.footerCta;
  document.getElementById("contact-hours-title").textContent = u.metaHours;
  document.getElementById("contact-cta").textContent = u.footerCta;
  document.getElementById("contact-hours").innerHTML = (c.hours || []).map((hour) => `
    <div class="hours-line"><span>${esc(hour.day)}</span><span>${esc(hour.time)}</span></div>
  `).join("");
  document.getElementById("footer-brand").textContent = `${c.brandName} — ${c.tagline}`;
  document.getElementById("footer-meta").textContent = `${c.phoneDisplay} · ${c.address}`;

  const lightbox = document.getElementById("gallery-lightbox");
  lightbox.setAttribute("aria-label", u.lightboxLabel);
  document.getElementById("lightbox-close").setAttribute("aria-label", u.lightboxClose);
  document.getElementById("lightbox-prev").setAttribute("aria-label", u.lightboxPrev);
  document.getElementById("lightbox-next").setAttribute("aria-label", u.lightboxNext);

  const chevronSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const servicesGrid = document.getElementById("services-grid");
  servicesGrid.innerHTML = (c.services || []).map((service, index) => {
    const details = (service.items || []).map((item) => `<li>${esc(item)}</li>`).join("");
    return `
      <div class="service-item" data-reveal style="--delay:${Math.min(index, 6) * 0.05}s">
        <button type="button" class="service-trigger" aria-expanded="false" id="service-trigger-${index}" aria-controls="service-panel-${index}">
          <div class="service-trigger-text">
            <p class="service-kicker">${esc(service.label)}</p>
            <h3>${esc(service.name)}</h3>
            <p class="service-teaser">${esc(service.description)}</p>
          </div>
          <span class="service-chevron">${chevronSvg}</span>
        </button>
        <div class="service-panel" id="service-panel-${index}" role="region" aria-labelledby="service-trigger-${index}">
          <div class="service-panel-inner">
            <div class="service-panel-body">
              <ul class="service-details">${details}</ul>
            </div>
          </div>
        </div>
      </div>`;
  }).join("");

  servicesGrid.addEventListener("click", (event) => {
    const trigger = event.target.closest(".service-trigger");
    if (!trigger || !servicesGrid.contains(trigger)) return;
    const item = trigger.closest(".service-item");
    const willOpen = !item.classList.contains("is-open");
    servicesGrid.querySelectorAll(".service-item.is-open").forEach((openItem) => {
      openItem.classList.remove("is-open");
      const button = openItem.querySelector(".service-trigger");
      if (button) button.setAttribute("aria-expanded", "false");
    });
    if (willOpen) {
      item.classList.add("is-open");
      trigger.setAttribute("aria-expanded", "true");
    }
  });

  const ritualViewport = document.getElementById("ritual-carousel");
  const ritualTrack = document.getElementById("ritual-track");
  if (ritualTrack && ritualViewport && c.ritualSteps && c.ritualSteps.length) {
    ritualViewport.setAttribute("aria-label", u.ritualTitle);
    const slide = (step) => `
      <article class="ritual-slide">
        <div class="ritual-slide-media">
          <img src="${esc(step.img)}" alt="${esc(step.title)}" loading="lazy" decoding="async">
        </div>
        <div class="ritual-slide-time">${esc(step.time)}</div>
        <h3 class="ritual-slide-title">${esc(step.title)}</h3>
      </article>`;
    const slides = c.ritualSteps.map(slide).join("");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    ritualTrack.innerHTML = reducedMotion ? slides : slides + slides;

    const pxPerSec = 42;
    const dragThreshold = 8;
    let paused = false;
    let pauseTimer = 0;
    let inView = false;
    let offset = 0;
    let half = 0;
    let lastTs = 0;
    let pointerDown = false;
    let dragging = false;
    let dragX = 0;
    let dragOrigin = 0;

    const measure = () => { half = ritualTrack.scrollWidth / 2; };
    const apply = () => {
      if (half > 0) offset = ((offset % half) + half) % half;
      ritualTrack.style.transform = `translate3d(${-offset}px,0,0)`;
    };
    const pauseAuto = (ms = 2400) => {
      paused = true;
      clearTimeout(pauseTimer);
      pauseTimer = setTimeout(() => { paused = false; }, ms);
    };
    const carouselIO = new IntersectionObserver((entries) => {
      inView = entries.some((entry) => entry.isIntersecting);
    }, { threshold: 0.12 });
    carouselIO.observe(ritualViewport);

    const onResize = () => {
      const prevHalf = half;
      measure();
      if (prevHalf > 0 && half > 0) offset = offset * (half / prevHalf);
      apply();
    };
    window.addEventListener("resize", onResize, { passive: true });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { measure(); apply(); }).catch(() => {});
    }
    requestAnimationFrame(() => { measure(); apply(); });

    if (!reducedMotion) {
      const tick = (ts) => {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(48, ts - lastTs) / 1000;
        lastTs = ts;
        if (!paused && !dragging && inView && half > 0) {
          offset += pxPerSec * dt;
          apply();
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    ritualViewport.addEventListener("pointerdown", (event) => {
      if (reducedMotion) return;
      if (event.pointerType === "mouse" && event.button !== 0) return;
      pointerDown = true;
      dragging = false;
      dragX = event.clientX;
      dragOrigin = offset;
    });
    ritualViewport.addEventListener("pointermove", (event) => {
      if (!pointerDown || reducedMotion) return;
      const dx = event.clientX - dragX;
      if (!dragging) {
        if (Math.abs(dx) < dragThreshold) return;
        dragging = true;
        paused = true;
        ritualViewport.classList.add("is-dragging");
        ritualViewport.setPointerCapture(event.pointerId);
      }
      offset = dragOrigin - dx;
      apply();
    });
    const endPointer = (event) => {
      if (!pointerDown) return;
      pointerDown = false;
      if (dragging) {
        dragging = false;
        ritualViewport.classList.remove("is-dragging");
        if (ritualViewport.hasPointerCapture(event.pointerId)) {
          ritualViewport.releasePointerCapture(event.pointerId);
        }
        pauseAuto();
      }
    };
    ritualViewport.addEventListener("pointerup", endPointer);
    ritualViewport.addEventListener("pointercancel", endPointer);
    ritualViewport.addEventListener("pointerleave", (event) => {
      if (dragging) endPointer(event);
    });
    ritualViewport.addEventListener("mouseenter", () => { paused = true; });
    ritualViewport.addEventListener("mouseleave", () => {
      if (!dragging) pauseAuto(400);
    });
  }

  document.getElementById("testimonials-grid").innerHTML = (c.testimonials || []).map((item, index) => `
    <div class="testimonial-card" data-reveal style="--delay:${index * 0.08}s">
      <blockquote>“${esc(item.quote)}”</blockquote>
      <div class="author">— ${esc(item.name)}</div>
    </div>
  `).join("");

  const galleryGrid = document.getElementById("gallery-grid");
  const galleryImages = [];
  galleryGrid.innerHTML = (c.gallery || []).map((src, index) => `
    <div class="gallery-tile" data-parallax-tile data-gallery-idx="${index}" role="button" tabindex="0" aria-label="${esc(u.galleryImageAlt)} ${index + 1}">
      <img src="${esc(src)}" alt="${esc(u.galleryImageAlt)} ${index + 1}" class="gallery-img">
      <div class="zoom-hint" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6" stroke-linecap="round"/></svg>
      </div>
      <div class="ph gallery-fallback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5.5-5.5L9 18"/></svg>
        <span>${esc(u.gallerySoon)}</span>
      </div>
    </div>
  `).join("");

  galleryGrid.querySelectorAll(".gallery-tile").forEach((tile) => {
    const img = tile.querySelector(".gallery-img");
    const fallback = tile.querySelector(".gallery-fallback");
    const index = parseInt(tile.dataset.galleryIdx, 10);
    const probe = new Image();
    probe.onload = () => {
      fallback.style.display = "none";
      tile.classList.add("has-image");
      galleryImages[index] = img.src;
    };
    probe.onerror = () => {
      img.style.display = "none";
      tile.removeAttribute("role");
      tile.removeAttribute("tabindex");
      tile.removeAttribute("aria-label");
      tile.style.cursor = "default";
    };
    probe.src = img.src;
  });

  (function initGalleryLightbox() {
    const lb = document.getElementById("gallery-lightbox");
    const lbImg = document.getElementById("lightbox-img");
    const lbCounter = document.getElementById("lightbox-counter");
    const btnClose = document.getElementById("lightbox-close");
    const btnPrev = document.getElementById("lightbox-prev");
    const btnNext = document.getElementById("lightbox-next");
    if (!lb || !lbImg) return;

    let current = 0;
    let touchStartX = 0;
    const available = () => galleryImages.map((src, index) => (src ? index : -1)).filter((index) => index >= 0);
    const showAt = (index) => {
      const items = available();
      if (!items.length) return;
      current = ((index % items.length) + items.length) % items.length;
      const srcIdx = items[current];
      lbImg.src = galleryImages[srcIdx];
      lbImg.alt = `${u.galleryImageAlt} ${srcIdx + 1}`;
      lbCounter.textContent = `${current + 1} / ${items.length}`;
      btnPrev.style.display = items.length > 1 ? "" : "none";
      btnNext.style.display = items.length > 1 ? "" : "none";
    };
    const open = (srcIdx) => {
      const items = available();
      const pos = items.indexOf(srcIdx);
      if (pos < 0) return;
      current = pos;
      showAt(current);
      lb.hidden = false;
      lb.setAttribute("aria-hidden", "false");
      document.body.classList.add("lightbox-open");
      requestAnimationFrame(() => lb.classList.add("is-open"));
      btnClose.focus();
    };
    const close = () => {
      lb.classList.remove("is-open");
      lb.setAttribute("aria-hidden", "true");
      document.body.classList.remove("lightbox-open");
      setTimeout(() => {
        lb.hidden = true;
        lbImg.removeAttribute("src");
      }, 320);
    };
    const step = (dir) => showAt(current + dir);

    galleryGrid.addEventListener("click", (event) => {
      const tile = event.target.closest(".gallery-tile.has-image");
      if (!tile) return;
      open(parseInt(tile.dataset.galleryIdx, 10));
    });
    galleryGrid.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const tile = event.target.closest(".gallery-tile.has-image");
      if (!tile) return;
      event.preventDefault();
      open(parseInt(tile.dataset.galleryIdx, 10));
    });
    btnClose.addEventListener("click", close);
    btnPrev.addEventListener("click", () => step(-1));
    btnNext.addEventListener("click", () => step(1));
    lb.addEventListener("click", (event) => { if (event.target === lb) close(); });
    document.addEventListener("keydown", (event) => {
      if (lb.hidden) return;
      if (event.key === "Escape") close();
      if (event.key === "ArrowLeft") step(-1);
      if (event.key === "ArrowRight") step(1);
    });
    lb.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    lb.addEventListener("touchend", (event) => {
      const dx = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) < 40) return;
      step(dx > 0 ? -1 : 1);
    }, { passive: true });
  })();

  const nav = document.getElementById("nav");
  const onNavScroll = () => nav.classList.toggle("scrolled", window.scrollY > 40);
  window.addEventListener("scroll", onNavScroll, { passive: true });
  onNavScroll();

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  const isCoarse = window.matchMedia("(pointer: coarse)").matches;

  if (!reduced) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          io.unobserve(entry.target);
        }
      });
    }, {
      threshold: isCoarse ? 0.06 : 0.12,
      rootMargin: isCoarse ? "0px" : "0px 0px -30px 0px"
    });
    document.querySelectorAll("[data-reveal]").forEach((el) => {
      if (el.closest(".hero")) return;
      io.observe(el);
    });

    const revealHeroContent = () => {
      document.querySelectorAll(".hero .hero-inner [data-reveal]").forEach((el) => {
        const delay = parseFloat(el.style.getPropertyValue("--delay")) || 0;
        setTimeout(() => el.classList.add("is-visible"), delay * 1000);
      });
      const meta = document.querySelector(".hero-meta");
      const cue = document.getElementById("scroll-cue");
      setTimeout(() => {
        if (meta) meta.classList.add("is-visible");
        if (cue) cue.classList.add("is-visible");
      }, 320);
    };
    requestAnimationFrame(revealHeroContent);
  } else {
    document.querySelectorAll("[data-reveal]").forEach((el) => el.classList.add("is-visible"));
    const cue = document.getElementById("scroll-cue");
    if (cue) cue.classList.add("is-visible");
  }

  if (!reduced) {
    const motion = {
      blobScroll: isCoarse ? 0.42 : 0.5,
      blobPointer: isCoarse ? 8 : 18,
      blobFloat: isCoarse ? 16 : 20,
      galleryY: isCoarse ? 60 : 110,
      galleryX: isCoarse ? 0 : 30,
      galleryRotate: isCoarse ? 0 : 2.5,
      galleryScale: isCoarse ? 0.05 : 0.06,
      tiltMax: canHover ? 14 : 11,
      tiltScroll: isCoarse ? 12 : 10,
      heroDrift: isCoarse ? 0.14 : 0.18,
      heroImgX: isCoarse ? 0 : 8
    };

    const blobs = document.querySelectorAll("[data-parallax]");
    const tiles = document.querySelectorAll("[data-parallax-tile]");
    const heroInner = document.querySelector(".hero-inner");
    const viewHeight = () => window.innerHeight;
    let ptrX = 0;
    let ptrY = 0;
    let ptrOn = false;

    const setPointer = (event) => {
      ptrX = (event.clientX / window.innerWidth - 0.5) * 2;
      ptrY = (event.clientY / window.innerHeight - 0.5) * 2;
      ptrOn = true;
    };
    const clearPointer = () => {
      ptrOn = false;
      ptrX = 0;
      ptrY = 0;
    };

    if (canHover) {
      window.addEventListener("pointermove", setPointer, { passive: true });
    } else {
      window.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "touch") setPointer(event);
      }, { passive: true });
      window.addEventListener("pointermove", (event) => {
        if (event.pointerType === "touch") setPointer(event);
      }, { passive: true });
      window.addEventListener("pointerup", clearPointer, { passive: true });
      window.addEventListener("pointercancel", clearPointer, { passive: true });
    }

    document.querySelectorAll("[data-tilt]").forEach((card) => {
      const inner = card.querySelector(".about-card-inner") || card;
      const max = motion.tiltMax;
      let dragging = false;
      const applyTilt = (cx, cy) => {
        const rect = card.getBoundingClientRect();
        const px = (cx - rect.left) / rect.width;
        const py = (cy - rect.top) / rect.height;
        const ry = (px - 0.5) * max * 2;
        const rx = (0.5 - py) * max * 2;
        inner.style.setProperty("--rx", `${rx.toFixed(2)}deg`);
        inner.style.setProperty("--ry", `${ry.toFixed(2)}deg`);
        if (canHover) inner.style.boxShadow = `${ry * -0.8}px ${rx * 0.8 + 20}px 50px -12px rgba(0,0,0,0.22)`;
      };
      const resetTilt = () => {
        dragging = false;
        delete card.dataset.tiltActive;
        if (!canHover) return;
        inner.style.setProperty("--rx", "0deg");
        inner.style.setProperty("--ry", "0deg");
        inner.style.boxShadow = "";
      };
      card.addEventListener("pointerdown", (event) => {
        dragging = true;
        card.dataset.tiltActive = "1";
        applyTilt(event.clientX, event.clientY);
      }, { passive: true });
      card.addEventListener("pointermove", (event) => {
        if (dragging || canHover) applyTilt(event.clientX, event.clientY);
      }, { passive: true });
      card.addEventListener("pointerup", resetTilt, { passive: true });
      card.addEventListener("pointercancel", resetTilt, { passive: true });
      if (canHover) card.addEventListener("pointerleave", resetTilt, { passive: true });
    });

    if (tiles.length) {
      const galleryIO = new IntersectionObserver((entries) => {
        entries.forEach((entry) => entry.target.classList.toggle("in-view", entry.isIntersecting));
      }, { threshold: isCoarse ? 0.35 : 0.45 });
      tiles.forEach((tile) => galleryIO.observe(tile));
    }

    const update = () => {
      const y = window.scrollY;
      const time = Date.now() * 0.001;
      const viewH = viewHeight();

      blobs.forEach((blob, index) => {
        const speed = parseFloat(blob.dataset.parallax) || 0.2;
        const scrollY = y * speed * -motion.blobScroll;
        const strength = (index + 1) * motion.blobPointer;
        const mx = (canHover || ptrOn) ? ptrX * strength : ptrX * strength * 0.5;
        const my = (canHover || ptrOn) ? ptrY * strength : ptrY * strength * 0.5;
        const float = Math.sin(time + index * 1.4) * motion.blobFloat;
        blob.style.transform = `translate3d(${mx}px, ${scrollY + my + float}px, 0)`;
      });

      if (heroInner) {
        const progress = Math.min(y / viewH, 1);
        if (y < viewH * 1.2) {
          heroInner.style.transform = `translate3d(0, ${y * motion.heroDrift}px, 0)`;
          heroInner.style.opacity = String(1 - progress * 0.35);
        } else {
          heroInner.style.transform = "";
          heroInner.style.opacity = "";
        }
      }

      tiles.forEach((tile, index) => {
        const rect = tile.getBoundingClientRect();
        const center = rect.top + rect.height / 2 - viewH / 2;
        const progress = center / viewH;
        const dir = index % 2 === 0 ? 1 : -1;
        const col = index % 4;
        const offsetY = Math.max(Math.min(progress * -motion.galleryY * dir, isCoarse ? 40 : 75), isCoarse ? -40 : -75);
        const offsetX = isCoarse ? 0 : Math.max(Math.min(progress * motion.galleryX * (col - 1.5), 28), -28);
        const rotate = isCoarse ? 0 : progress * motion.galleryRotate * dir;
        tile.style.transform = `translate3d(${offsetX}px, ${offsetY}px, 0) rotate(${rotate}deg)`;

        const img = tile.querySelector(".gallery-img");
        if (img) {
          const inView = rect.top < viewH && rect.bottom > 0;
          const dist = Math.min(Math.abs(progress), 1);
          const scale = inView ? 1.12 + dist * motion.galleryScale : 1.12;
          const imgY = progress * (isCoarse ? -14 : -24);
          const imgX = isCoarse ? 0 : progress * motion.heroImgX * (index % 2 === 0 ? 1 : -1);
          img.style.transform = `scale(${scale}) translate3d(${imgX}px, ${imgY}px, 0)`;
        }
      });

      if (!canHover) {
        document.querySelectorAll("[data-tilt]").forEach((card) => {
          if (card.dataset.tiltActive) return;
          const inner = card.querySelector(".about-card-inner") || card;
          const rect = card.getBoundingClientRect();
          const center = rect.top + rect.height / 2 - viewH / 2;
          const progress = Math.max(Math.min(center / (viewH / 2), 1), -1);
          const rx = progress * -motion.tiltScroll;
          const ry = progress * (motion.tiltScroll * 0.7);
          inner.style.setProperty("--rx", `${rx.toFixed(2)}deg`);
          inner.style.setProperty("--ry", `${ry.toFixed(2)}deg`);
        });
      }
    };

    const loop = () => {
      update();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    window.addEventListener("resize", update, { passive: true });
    window.addEventListener("orientationchange", () => setTimeout(update, 150), { passive: true });
  }
})();
</script>
</body>
</html>
